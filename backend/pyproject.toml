[project]
name = "akar-backend"
version = "0.1.0"
description = "AKAR backend: identifikasi spesies mangrove dan API untuk aplikasi web"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "supabase>=2.10",
  "PyJWT[crypto]>=2.9",
  "pillow>=10.4",
  "httpx>=0.27",
]

[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Header",
  "app.api.deps.require_roles",
]
